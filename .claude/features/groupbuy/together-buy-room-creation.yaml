meta:
  id: TOGETHER_BUY_ROOM_CREATION
  domain: groupbuy
  status: implemented
  priority: high
  code_paths:
    - src/main/kotlin/com/moongchijang/domain/groupbuy/presentation/GroupBuyController.kt
    - src/main/kotlin/com/moongchijang/domain/groupbuy/application/TogetherBuyRoomCommandService.kt
    - src/main/kotlin/com/moongchijang/domain/groupbuy/application/dto/TogetherBuyRoomCreateDto.kt
  openapi_paths:
    - POST /api/v1/group-buys
  related_requirements:
    - "3.2.1"
    - "3.2.2"
    - "3.2.3"
    - "3.2.4"

overview:
  summary: 소비자가 총대가 되어 상품, 픽업 일정, 본인 수량을 선택해 함께 사기 방을 생성한다.

business_rules:
  - 활성 상품과 판매 중인 매장만 방을 만들 수 있다.
  - 요청한 상품은 요청한 매장에 속해야 한다.
  - 선택한 날짜와 1시간 픽업 시간대는 매장 픽업 가능 일정에서 서버가 다시 검증한다.
  - 단가, 최소·최대 수량, 결제 마감은 클라이언트 값이 아닌 서버 상품·픽업 정책에서 결정한다.
  - 총대는 생성과 동시에 첫 참여자로 저장되며 재판매 금지 동의는 필수다.
  - 단독 구매 방은 총대 수량만으로 최소 수량을 만족해야 한다.

error_cases:
  - PRODUCT_NOT_FOUND
  - GROUPBUY_ROOM_PRODUCT_NOT_AVAILABLE
  - GROUPBUY_ROOM_PICKUP_NOT_AVAILABLE
  - GROUPBUY_ROOM_INVALID_QUANTITY

testing_strategy:
  unit:
    - TogetherBuyRoomCommandServiceTest 정상 생성
    - TogetherBuyRoomCommandServiceTest 상품/매장 불일치 및 비활성 상품 거절
    - TogetherBuyRoomCommandServiceTest 픽업 시간대 재검증 및 단독 방 최소 수량 검증
